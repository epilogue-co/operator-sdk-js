<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opsdk browser check</title>
<style>
  :root { color-scheme: light dark; --ok: #1b7f4a; --bad: #be3434; --muted: #6b7280; }
  @media (prefers-color-scheme: dark) { :root { --ok: #4fc584; --bad: #ff7070; --muted: #9198a6; } }
  body { margin: 0; padding: 24px 20px; font: 14px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { max-width: 860px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 0; color: var(--muted); }
  label { display: inline-flex; gap: 6px; align-items: center; margin-right: 14px; }
  pre { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .skip { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>opsdk browser check</h1>
  <p>The steps of <code>npm run check</code>, over Web Serial or WebUSB in this browser. With the Operator granted before, <code>?auto</code> runs on load. <code>?write</code> also writes a pattern to the save and restores the original. <code>?usb</code> uses WebUSB instead of Web Serial.</p>
  <div>
    <label><input type="checkbox" id="write"> Save write and restore</label>
    <label><input type="checkbox" id="stall" checked> Busy-page ROM read</label>
    <label><input type="checkbox" id="usb"> WebUSB (else Web Serial)</label>
    <button id="run" type="button">Run check</button>
  </div>
  <pre id="out"></pre>
</main>
<script type="module">
import { Operator, USB_DEVICE_FILTERS, USB_FILTERS, VERSION } from '../dist/index.js';
import { runChecks } from './checks.mjs';

const q = new URLSearchParams(location.search);
const out = document.getElementById('out');
document.getElementById('write').checked = q.has('write');
document.getElementById('usb').checked = q.has('usb');
function line(text, cls = '') {
  const s = document.createElement('span');
  s.className = cls;
  s.textContent = text + '\n';
  out.append(s);
}
const stall = (ms) => {
  const end = performance.now() + ms;
  while (performance.now() < end);
};

async function open(fromClick) {
  if (document.getElementById('usb').checked) {
    const devices = await navigator.usb.getDevices();
    const device = devices.find((d) => USB_DEVICE_FILTERS.some((f) => d.vendorId === f.vendorId && d.productId === f.productId));
    if (device) return Operator.openUsbDevice(device);
    if (!fromClick) throw new Error('No Operator granted to this page over WebUSB yet. Press Run check.');
    return Operator.requestUsbDevice();
  }
  const ports = await navigator.serial.getPorts();
  const port = ports.find((p) => USB_FILTERS.some((f) => p.getInfo().usbVendorId === f.usbVendorId && p.getInfo().usbProductId === f.usbProductId));
  if (port) return Operator.openPort(port);
  if (!fromClick) throw new Error('No Operator granted to this page yet. Press Run check.');
  return Operator.requestPort();
}

async function run(fromClick) {
  out.textContent = '';
  line(`opsdk ${VERSION} over ${document.getElementById('usb').checked ? 'WebUSB' : 'Web Serial'}, ${navigator.userAgent.match(/Chrom\w+\/[\d.]+/)?.[0] ?? navigator.userAgent}`);
  let op;
  try {
    op = await open(fromClick);
  } catch (e) {
    line(`  FAIL ${'open'.padEnd(28)} ${e.message} (${e.name})`, 'bad');
    return report({ checks: 1, fails: 1 });
  }
  const res = await runChecks(
    op,
    (ok, name, detail) => line(`${ok === null ? '  --  ' : ok ? '  ok  ' : '  FAIL'} ${name.padEnd(28)} ${detail}`, ok === null ? 'skip' : ok ? 'ok' : 'bad'),
    { write: document.getElementById('write').checked, stall: document.getElementById('stall').checked ? stall : null },
  );
  await op.close().catch(() => {});
  report(res);
}

function report({ checks, fails }) {
  line(`${checks} checks, ${fails} failed`, fails ? 'bad' : 'ok');
}
document.getElementById('run').addEventListener('click', () => run(true));
if (q.has('auto')) run(false);
</script>
</body>
</html>
